<title>Jornada Combo Vitalício</title>
<meta name="description" content="Diagnóstico de estudos do Combo Vitalício: descubra por onde começar e receba um cronograma personalizado.">

/* Identidade Combo Vitalício (Dr. João): fundo preto, dourado com brilho, títulos em caixa alta.
   Layout: coluna única (máx. 46rem); banner do Dr. João só na abertura; formulário em etapas; resultado empilhado. */
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface-2: #1c1a17;
  --ink: #f3efe7;
  --muted: #b3ab9d;
  --line: #34302a;
  --gold-1: #f8e2a6;
  --gold-2: #d9a84e;
  --gold-3: #9c6a24;
  --accent: #e0b25c;
  --accent-ink: #1a1206;
  --accent-soft: #2a2215;
  --gold-grad: linear-gradient(135deg, var(--gold-1) 0%, var(--gold-2) 45%, var(--gold-3) 100%);
  --warn: #f0c46a;
  --warn-soft: #2b2416;
  --error: #ff8f8a;
  --error-soft: #36191a;
  --ok: #9fd8a9;
  --ok-soft: #17291b;
  --focus: #ffd98a;
  --font-display: 'Montserrat', 'Arial Black', system-ui, sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --radius: 10px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.55; }
.wrap { max-width: 46rem; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 18px 10px; }
.brand { font-family: var(--font-display); font-size: 1.05rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand small { -webkit-text-fill-color: var(--muted); display: block; font-family: var(--font-body); font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1px dashed var(--line); color: var(--muted); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius); background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); font-size: .92rem; margin-block: 6px 14px; }
.banner strong { color: var(--warn); }
.banner.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.banner.ok strong { color: var(--ok); }
.banner.err { background: var(--error-soft); border-color: color-mix(in srgb, var(--error) 35%, transparent); }
.banner.err strong { color: var(--error); }

h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; text-transform: uppercase; letter-spacing: .01em; }
h1 .gold, h2 .gold, .gold-text { background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
h1 { font-size: clamp(1.75rem, 6.5vw, 2.7rem); font-weight: 800; }
h2 { font-size: clamp(1.3rem, 4.5vw, 1.7rem); font-weight: 800; }
h3 { font-size: 1.02rem; font-weight: 700; letter-spacing: .03em; color: var(--accent); }
p { margin: 0; }
.lead { font-size: 1.08rem; color: var(--muted); max-width: 62ch; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.intro-list { margin: 0; padding-left: 1.2rem; display: grid; gap: 6px; }
.notice { font-size: .9rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; }

.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #000 0%, rgba(0,0,0,.6) 14%, rgba(0,0,0,0) 34%), linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 8rem, #000 16.5rem); }
.hero-body { position: relative; z-index: 1; padding: 13rem 18px 22px; display: flex; flex-direction: column; gap: 12px; }
.hero .lead { color: #e2dccf; }
.kicker { font-family: var(--font-display); font-weight: 700; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
@media (min-width: 700px) {
  .hero { min-height: 24rem; align-items: center; }
  .hero::before { inset: 0 0 0 32%; height: auto; background-position: right center; background-size: auto 100%; background-repeat: no-repeat; }
  .hero::after { background: linear-gradient(90deg, #000 34%, rgba(0,0,0,.85) 46%, rgba(0,0,0,0) 72%); }
  .hero-body { max-width: 58%; padding: 32px; }
}

/* Progresso */
.progress { display: flex; flex-direction: column; gap: 8px; padding-block: 6px 4px; }
.progress-label { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); font-weight: 600; }
.progress-bar { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 4px; }
.progress-bar span { height: 6px; border-radius: 3px; background: var(--line); }
.progress-bar span.done { background: var(--gold-grad); }
.progress-bar span.now { background: color-mix(in srgb, var(--accent) 55%, var(--line)); }

/* Campos */
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field legend { font-weight: 600; font-size: 1rem; padding: 0; }
fieldset.field { border: 0; margin: 0; padding: 0; min-width: 0; }
.req { color: var(--error); margin-left: 2px; }
.opt { font-weight: 400; color: var(--muted); font-size: .85rem; margin-left: 4px; }
.help { font-size: .88rem; color: var(--muted); }
.err-msg { font-size: .88rem; color: var(--error); font-weight: 600; }
input[type="text"], input[type="email"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 11px 12px; min-height: 46px;
}
textarea { min-height: 92px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.8); }
.invalid input, .invalid select, .invalid textarea { border-color: var(--error); }
.options { display: grid; gap: 8px; }
.options.cols { grid-template-columns: repeat(auto-fill, minmax(min(100%, 13rem), 1fr)); }
.opt-row { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; min-height: 46px; }
.opt-row:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt-row input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.opt-row span { min-width: 0; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.days .opt-row { flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; font-size: .85rem; text-align: center; }
.days .opt-row input { margin: 0; }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.seg .opt-row { justify-content: center; text-align: center; font-size: .88rem; padding: 9px 4px; flex-direction: column; align-items: center; gap: 4px; }
.seg .opt-row input { margin: 0; }
.subcard { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.prio-list { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none; }
.prio-list li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); }
.prio-list .rank { font-weight: 700; color: var(--accent); width: 1.6rem; font-variant-numeric: tabular-nums; }
.prio-list .name { flex: 1; min-width: 0; }
.icon-btn { font: inherit; font-size: .85rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 4px 9px; cursor: pointer; min-height: 34px; }
.inline { display: flex; gap: 10px; flex-wrap: wrap; }
.inline > * { flex: 1 1 10rem; min-width: 0; }

/* Botões */
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; padding-top: 6px; }
.actions .grow { flex: 1; }
.btn { font: inherit; font-family: var(--font-display); font-weight: 800; font-size: .95rem; letter-spacing: .04em; text-transform: uppercase; border-radius: 8px; padding: 13px 22px; min-height: 50px; cursor: pointer; border: 0; background: var(--gold-grad); color: var(--accent-ink); box-shadow: 0 0 0 1px rgba(248,226,166,.35) inset, 0 8px 28px -10px rgba(224,178,92,.7); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn:hover { filter: brightness(1.07); }
.btn.secondary { background: transparent; color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent) inset; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--muted); text-decoration: underline; padding-inline: 6px; font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-weight: 600; }
.btn[disabled] { opacity: .6; cursor: progress; }
.btn.block { width: 100%; }

.err-summary { border: 1.5px solid var(--error); background: var(--error-soft); border-radius: 8px; padding: 12px 14px; }
.err-summary ul { margin: 6px 0 0; padding-left: 1.2rem; }
.err-summary a { color: var(--error); font-weight: 600; }

/* Revisão */
.review-step { display: flex; flex-direction: column; gap: 8px; }
.review-step header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.review-step dl { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px 16px; }
.review-step dt { font-size: .82rem; color: var(--muted); font-weight: 600; margin-top: 8px; }
.review-step dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Resultado */
.result-section { display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-size: .76rem; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.start-card { border: 1.5px solid var(--accent); box-shadow: 0 0 40px -18px rgba(224,178,92,.6); border-radius: var(--radius); padding: 18px; background: linear-gradient(160deg, var(--surface-2), var(--surface)); display: flex; flex-direction: column; gap: 10px; }
.start-card h3 { font-size: 1.35rem; color: var(--ink); }
.seq { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; counter-reset: s; }
.seq li { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.seq li:first-child { border-top: 0; }
.seq .n { font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.seq .meta { font-size: .86rem; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); gap: 10px; }
.fact { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
.fact b { display: block; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.fact span { font-size: .8rem; color: var(--muted); }
.week { display: flex; flex-direction: column; gap: 8px; }
.week-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.week-head small { color: var(--muted); font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table.plan { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.plan th, table.plan td { text-align: left; vertical-align: top; padding: 9px 10px; border-top: 1px solid var(--line); }
table.plan thead th { border-top: 0; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--surface-2); }
table.plan td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
table.plan tr.rev td { background: var(--accent-soft); }
.tag { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .03em; padding: 1px 7px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); margin-left: 4px; vertical-align: 1px; }
.tag.cont { background: var(--accent-soft); color: var(--accent); }
.lesson-line + .lesson-line { margin-top: 6px; }
.lesson-line .course { display: block; font-size: .78rem; color: var(--muted); }
.forecast { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.forecast li { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 8px 0; border-top: 1px dashed var(--line); }
.forecast li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; }
.checklist li::before { content: ''; flex: none; width: 16px; height: 16px; margin-top: 4px; border: 2px solid var(--accent); border-radius: 4px; }

@media (max-width: 640px) {
  table.plan thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  table.plan, table.plan tbody, table.plan tr, table.plan td { display: block; width: 100%; }
  table.plan tr { border-top: 1px solid var(--line); padding: 8px 0; }
  table.plan tr:first-child { border-top: 0; }
  table.plan td { border: 0; padding: 4px 12px; display: grid; grid-template-columns: 7.2rem minmax(0, 1fr); gap: 8px; }
  table.plan td::before { content: attr(data-label); font-size: .74rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; padding-top: 2px; }
  .days { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .seg { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: no-preference) {
  .step-enter { animation: enter .25s ease-out; }
  @keyframes enter { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
@media print {
  :root { --bg: #fff; --surface: #fff; --surface-2: #f4f1ea; --ink: #000; --muted: #444; --line: #bbb; --accent: #7a5212; --accent-soft: #f4ecdc; }
  body { background: #fff; color: #000; }
  .hero::before, .hero::after { display: none; }
  .brand, .gold-text { -webkit-text-fill-color: #7a5212; color: #7a5212; background: none; }
  .no-print, .top .chip, .banner.no-print { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .panel, .start-card, .table-wrap { border-color: #999; background: #fff; }
  table.plan { font-size: 10pt; }
  table.plan tr { break-inside: avoid; }
  .result-section { break-inside: avoid-page; }
  a { color: #000; }
}

</style>

  <main id="app" tabindex="-1"></main>

<script>
/*
 * Motor de recomendação e cronograma — Combo Vitalício.
 * Funções puras: recebem respostas + catálogo e devolvem o plano.
 * Documentação: docs/logica-recomendacao.md
 * Regra de segurança: respostas abertas (texto livre) NUNCA são lidas por este motor.
 */
(function (root) {
  'use strict';

  const DEFAULTS = {
    DEFAULT_LESSON_MIN: 20,     // duração assumida quando a aula não tem duração cadastrada (sinalizada como estimativa)
    BLOCK_MIN: 30,              // curso sem aulas cadastradas: vira blocos de 30 min sobre a carga estimada
    BLOCKS_PER_STAGE: 4,        // blocos agrupados em etapas (marcos de progresso)
    MAX_SEQUENCE: 5,            // cursos na sequência principal; os demais vão para "depois"
    DETAIL_WEEKS: 4,            // semanas detalhadas no cronograma
    MAX_DAYS: 3 * 365,          // horizonte máximo de previsão
    SUPPORT_THEME_PATTERN: /organiza/i, // tema do curso de apoio à organização (quando existir no catálogo)

  const LEVELS = { iniciante: 1, basico: 2, intermediario: 3, avancado: 4 };
  const LEVEL_LABEL = { 1: 'Iniciante', 2: 'Básico', 3: 'Intermediário', 4: 'Avançado' };

  const floor5 = (x) => Math.floor(x / 5) * 5;
  const round5 = (x) => Math.round(x / 5) * 5;

  /* ---------- Catálogo ---------- */
  function buildCatalog(rows, version, isDemo, opts) {
    const o = Object.assign({}, DEFAULTS, opts || {});
    const courses = new Map();
    const warnings = [];
    for (const r of rows || []) {
      const ativo = String(r.ativo == null ? 'sim' : r.ativo).trim().toLowerCase();
      if (['não', 'nao', 'n', 'false', '0'].includes(ativo)) continue;
      const cid = String(r.curso_id || '').trim();
      if (!cid) continue;
      let c = courses.get(cid);
      if (!c) {
        c = {
          id: cid, titulo: String(r.curso_titulo || cid).trim(), descricao: String(r.curso_descricao || '').trim(),
          temas: split(r.temas), nivel: Math.min(4, Math.max(1, parseInt(r.nivel, 10) || 1)),
          prereqs: split(r.prerequisitos), objetivos: String(r.objetivos || '').trim(),
          link: safeUrl(r.link_curso), materiais: split(r.materiais), modMap: new Map(), order: courses.size,
          tipo: String(r.tipo || 'curso').trim().toLowerCase() || 'curso', carga: num(r.carga_estimada_h), cargaFonte: String(r.carga_fonte || '').trim(),
        };
        courses.set(cid, c);
      }
      const mid = String(r.modulo_id || cid + '-M').trim();
      let m = c.modMap.get(mid);
      if (!m) { m = { id: mid, titulo: String(r.modulo_titulo || '').trim(), ordem: num(r.modulo_ordem) || c.modMap.size + 1, aulas: [] }; c.modMap.set(mid, m); }
      if (String(r.aula_id || '').trim()) {
        const dur = num(r.duracao_min);
        m.aulas.push({
          id: String(r.aula_id).trim(), titulo: String(r.aula_titulo || '').trim(), ordem: num(r.aula_ordem) || m.aulas.length + 1,

        }

      if (missing.length) warnings.push(`Curso ${c.id}: pré-requisito(s) não encontrado(s) no catálogo: ${missing.join(', ')}.`);

      if (!c.lessons.length) warnings.push(`Curso ${c.id} não tem aulas cadastradas.`);
      const semDur = c.lessons.filter((l) => l.dur == null).length;
      if (semDur) warnings.push(`Curso ${c.id}: ${semDur} aula(s) sem duração cadastrada.`);
    }
    const themes = [];
    list.forEach((c) => c.temas.forEach((t) => { if (!themes.includes(t)) themes.push(t); }));
    const byId = Object.fromEntries(list.map((c) => [c.id, c]));
    return { version: version || 'sem-versao', demo: !!isDemo, courses: list.filter((c) => c.lessons.length), byId, themes, warnings, resources, blockCourses: list.filter((c) => c.blockMode).length };
  }

  function safeUrl(u) {
    const s = String(u || '').trim();
    return /^https:\/\/[^\s"'<>]+$/i.test(s) ? s : '';
  }

  /* ---------- Recomendação ---------- */
  function recommend(a, cat, opts) {
    const o = Object.assign({}, DEFAULTS, opts || {});
    const byId = cat.byId;
    const themes = (a.temas || []).filter((t) => cat.themes.includes(t)).slice(0, 3);
    const prog = a.iniciou && a.iniciou !== 'nao' ? (a.cursos_iniciados || {}) : {};

    const pctOf = (id) => (prog[id] && prog[id].status === 'andamento' ? Number(prog[id].pct) || 0 : 0);
    const inProgress = (id) => prog[id] && prog[id].status === 'andamento' && byId[id];
    const lvlTheme = (t) => LEVELS[(a.nivel_tema || {})[t]] || 1;
    const minLevel = themes.length ? Math.min(...themes.map(lvlTheme)) : 1;
    const studentLevelFor = (c) => {
      const ls = c.temas.filter((t) => themes.includes(t)).map(lvlTheme);
      return ls.length ? Math.max(...ls) : minLevel;
    };

    // Sinais de necessidade de fundamentos (somente respostas fechadas)
    const fundSignals = [];
    if (a.revisar_fundamentos === 'sim') fundSignals.push('quer revisar os fundamentos antes de avançar');
    if (['frequentemente', 'quase_sempre'].includes(a.freq_conceitos)) fundSignals.push('encontra com frequência conceitos que ainda não compreende');
    if (a.momento === 'comecando') fundSignals.push('está começando seus estudos na área');
    if (a.momento === 'retomando') fundSignals.push('está retomando os estudos após um período afastado');
    if (minLevel <= 1) fundSignals.push('se avaliou como iniciante em ao menos um dos temas escolhidos');
    const needsFund = a.revisar_fundamentos === 'sim' || (a.revisar_fundamentos !== 'nao' && fundSignals.length > 0);

    const info = new Map();
    const add = (id, pts, reason) => {
      if (!byId[id]) return;
      if (!info.has(id)) info.set(id, { score: 0, reasons: [] });
      const it = info.get(id);
      it.score += pts;
      if (reason && !it.reasons.some((r) => r.k === reason.k && r.t === reason.t && r.of === reason.of)) it.reasons.push(reason);
    };

    // 1) Cursos-alvo: temas priorizados, curso desejado, cursos em andamento, apoio à organização
    const W = [30, 20, 10];
    themes.forEach((t, i) => cat.courses.forEach((c) => { if (c.temas.includes(t)) add(c.id, W[i], { k: 'tema', t, rank: i + 1 }); }));
    if (a.curso_desejado && byId[a.curso_desejado]) add(a.curso_desejado, 15, { k: 'desejado' });
    Object.keys(prog).forEach((id) => { if (inProgress(id)) add(id, 12, { k: 'continuar', pct: pctOf(id) }); });
    const atr = a.atrapalha || [];
    const orgPain = atr.includes('por_onde_comecar') ? 'por_onde_comecar' : atr.includes('organizacao') ? 'organizacao' : null;
    if (orgPain) cat.courses.filter((c) => c.temas.some((t) => o.SUPPORT_THEME_PATTERN.test(t))).forEach((c) => add(c.id, 6, { k: 'apoio', pain: orgPain }));

    // 2) Expande pré-requisitos (recursivo). Cursos concluídos satisfazem o pré-requisito.
    const waived = [];
    const isWaived = (c, p) => inProgress(c.id) && (pctOf(c.id) >= 50 || studentLevelFor(c) >= 3);
    const selected = new Set([...info.keys()].filter((id) => !done(id)));
    const edges = new Map(); // id -> prereqs que entram na ordenação
    const queue = [...selected];

      const id = queue.shift();
      const c = byId[id];

        if (done(p)) continue;
        if (isWaived(c, p)) { waived.push({ course: id, prereq: p }); continue; }
        ps.push(p);
        add(p, 0, { k: 'prereq', of: id });
        if (!selected.has(p)) { selected.add(p); queue.push(p); }

      edges.set(id, ps);
    }
    // Ajustes por nível e objetivo
    for (const [id, it] of info) {
      if (!selected.has(id)) continue;
      const c = byId[id];
      const gap = c.nivel - studentLevelFor(c);
      if (needsFund && c.nivel === 1) { it.score += 10; it.reasons.push({ k: 'fundamentos' }); }
      if (needsFund && c.nivel >= 3) it.score -= 5;
      if (a.objetivo === 'base' && c.nivel <= 2) it.score += 6;
      if (a.objetivo === 'aprofundar' && gap >= 0 && gap <= 1) it.score += 4;
      if (gap >= 2) { it.score -= 8; it.reasons.push({ k: 'acima', gap }); }
      if (!needsFund && c.nivel === 1 && minLevel >= 3) it.score -= 4;
    }

    for (let pass = 0; pass < 6; pass++) {

        if (sp && sc && sp.score < sc.score + 1) sp.score = sc.score + 1;
      }
    }

    // 3) Ordenação topológica (pré-requisitos sempre antes), desempate por pontuação, nível e ordem do catálogo
    const ids = [...selected];
    const indeg = new Map(ids.map((id) => [id, (edges.get(id) || []).filter((p) => selected.has(p)).length]));
    const order = [];
    const bestRank = (id) => Math.min(9, ...info.get(id).reasons.filter((r) => r.k === 'tema').map((r) => r.rank));
    const cmp = (x, y) => (info.get(y).score - info.get(x).score) || (bestRank(x) - bestRank(y)) || (byId[x].nivel - byId[y].nivel) || (byId[x].order - byId[y].order);
    let ready = ids.filter((id) => indeg.get(id) === 0);

      ready.sort(cmp);

    for (const id of order.slice()) {
      const c = byId[id];
      if (c.nivel !== 1 || inProgress(id) || id === a.curso_desejado) continue;
      const pos = order.indexOf(id);
      const covered = order.slice(0, pos).some((x) => byId[x].nivel > 1 && c.temas.every((t) => byId[x].temas.includes(t)));
      if (covered) { order.splice(pos, 1); order.push(id); }
    }
    const cyclic = ids.filter((id) => !order.includes(id));
    // Cursos em ciclo de pré-requisitos não são recomendados (erro de catálogo)

    const sequence = order.slice(0, o.MAX_SEQUENCE).map((id) => ({ id, course: byId[id], score: info.get(id).score, reasons: info.get(id).reasons, pct: pctOf(id) }));
    const later = order.slice(o.MAX_SEQUENCE).map((id) => byId[id]);

    return {
      themes, needsFund, fundSignals, minLevel, waived, cyclic, sequence, later,
      start: sequence[0] || null,
      desired: a.curso_desejado && byId[a.curso_desejado] ? byId[a.curso_desejado] : null,
      completedAll: !sequence.length,
    };
  }

  /* ---------- Explicações (texto montado só a partir de respostas fechadas e do catálogo) ---------- */
  function reasonPhrases(item, rec, cat) {
    const out = [];
    const rs = item.reasons;
    rs.filter((r) => r.k === 'continuar').forEach((r) => out.push(`você já começou este curso${r.pct ? ` (cerca de ${r.pct}% concluído)` : ''} e continuar aproveita o que já estudou`));
    rs.filter((r) => r.k === 'desejado').forEach(() => out.push('é o curso que você disse que deseja começar'));
    const pre = rs.filter((r) => r.k === 'prereq').map((r) => cat.byId[r.of].titulo);
    if (pre.length) out.push(`é pré-requisito de ${joinPt(pre)}`);
    rs.filter((r) => r.k === 'tema').sort((x, y) => x.rank - y.rank).slice(0, 1).forEach((r) => out.push(r.rank === 1
      ? `trabalha “${r.t}”, o tema que você colocou como prioridade número 1`
      : `trabalha “${r.t}”, sua ${r.rank}ª prioridade`));
    if (rs.some((r) => r.k === 'fundamentos') && rec.fundSignals.length) out.push(`você informou que ${joinPt(rec.fundSignals.slice(0, 2))}`);
    rs.filter((r) => r.k === 'apoio').forEach((r) => out.push(r.pain === 'por_onde_comecar'
      ? 'você contou que não saber por onde começar atrapalha sua constância, e este curso trata da organização dos estudos'
      : 'você contou que a falta de organização atrapalha sua constância, e este curso trata da organização dos estudos'));
    return out;
  }

  function roleOf(item, idx, cat) {
    const rs = item.reasons;
    if (idx === 0) return 'Ponto de partida';
    if (rs.some((r) => r.k === 'continuar')) return 'Continuação de um curso já iniciado';
    const pre = rs.filter((r) => r.k === 'prereq');
    if (pre.length) return `Base para ${joinPt(pre.map((r) => cat.byId[r.of].titulo))}`;
    const t = rs.find((r) => r.k === 'tema');
    if (t) return `Aprofunda o tema “${t.t}”`;
    if (rs.some((r) => r.k === 'desejado')) return 'Curso que você deseja fazer';
    if (rs.some((r) => r.k === 'apoio')) return 'Apoio à organização dos estudos';
    return 'Complemento da sua jornada';
  }

  function joinPt(arr) {
    if (arr.length <= 1) return arr.join('');
    return arr.slice(0, -1).join(', ') + ' e ' + arr[arr.length - 1];
  }

  /* ---------- Cronograma ---------- */
  function parseDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
    if (!m) return null;
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    return isNaN(d) ? null : d;
  }
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  function spreadPick(days, k) {
    if (k >= days.length) return days;
    const out = [];
    for (let i = 0; i < k; i++) out.push(days[Math.floor((i * days.length) / k)]);
    return out;
  }

  function buildSchedule(a, rec, cat, opts) {
    const o = Object.assign({}, DEFAULTS, opts || {});
    const notes = [];
    const start = parseDate(a.inicio) || new Date();
    const weeklyMin = Math.max(0, Math.round((num(a.horas_semana) || 0) * 60));
    const flex = a.previsibilidade === 'muda_bastante';
    const budget = Math.floor(weeklyMin * (flex ? 0.85 : 1));
    if (flex) notes.push('Como sua rotina muda bastante, deixamos cerca de 15% do seu tempo semanal livre como folga para imprevistos.');

    const dowOrder = [1, 2, 3, 4, 5, 6, 0];
    let days = dowOrder.filter((d) => (a.dias || []).map(Number).includes(d));
    if (!days.length) days = [1, 3, 5];
    const cap = SESSION_CAP[a.duracao_sessao] || 30;
    let sessionMin = Math.min(cap, floor5(budget / days.length));
    if (sessionMin < 10) {
      const k = Math.max(1, Math.floor(budget / 10));
      const kept = spreadPick(days, Math.min(k, days.length));
      if (kept.length < days.length) notes.push(`Com ${fmtMin(weeklyMin)} por semana, sessões em ${days.length} dias ficariam curtas demais. Usamos ${kept.length} dia(s): ${kept.map((d) => DOW[d]).join(', ')}.`);
      days = kept;
      sessionMin = Math.min(cap, floor5(budget / days.length));
    }
    if (sessionMin < 5) sessionMin = Math.max(5, Math.min(cap, budget));
    const ratio = REVIEW_RATIO[a.ritmo] || 0.2;
    let compMin = sessionMin <= 15 ? 0 : Math.max(5, round5(sessionMin * ratio));
    let contentMin = sessionMin - compMin;
    const perWeek = days.length;
    const weeklyUsed = perWeek * sessionMin;

    // Cadência de sessões de revisão (última sessão da semana)
    const every = perWeek >= 3 ? { leve: 1, equilibrado: 2, intensivo: 4 }[a.ritmo] || 2
      : perWeek === 2 ? { leve: 2, equilibrado: 3, intensivo: 4 }[a.ritmo] || 3
        : { leve: 3, equilibrado: 4, intensivo: 6 }[a.ritmo] || 4;

    // Fila de aulas por curso
    const seq = rec.sequence.map((s) => s.course).concat(rec.later);
    const state = new Map();
    for (const s of seq) {
      let lessons = s.lessons.slice();
      if (s.blockMode) {
        // Blocos do tamanho da parte de aula da sessão: um bloco por sessão, sem partes
        const total = s.lessons.reduce((t, l) => t + l.dur, 0);
        const n = Math.max(1, Math.ceil(total / contentMin));
        lessons = [];
        for (let i = 1; i <= n; i++) {
          // Etapas de BLOCKS_PER_STAGE sessões, para o aluno ter marcos curtos
          const stages = Math.ceil(n / o.BLOCKS_PER_STAGE);
          const k = Math.ceil(i / o.BLOCKS_PER_STAGE);
          const m = s.modulos[Math.min(k, s.modulos.length) - 1];
          lessons.push({ id: `${s.id}-B${i}`, titulo: `Bloco ${i} de ${n}`, dur: i < n ? contentMin : total - contentMin * (n - 1), estimated: true, block: true, link: '', curso: s.id, modulo: m.id, moduloTitulo: `Etapa ${k}`, stage: k, stages, first: i === 1, last: i === n });
        }
        lessons.forEach((l, i) => { l.stageEnd = !lessons[i + 1] || lessons[i + 1].stage !== l.stage; });
      }
      const pct = rec.sequence.find((x) => x.id === s.id)?.pct || 0;
      let skipped = 0;
      if (pct > 0) { skipped = Math.floor((lessons.length * pct) / 100); lessons = lessons.slice(skipped); }
      state.set(s.id, {
        course: s, skipped,
        queue: lessons.map((l) => ({ l, remaining: l.dur || o.DEFAULT_LESSON_MIN, total: l.dur || o.DEFAULT_LESSON_MIN, part: 0, estimated: !!l.estimated || l.dur == null, block: !!l.block })),
        startDate: null, endDate: null, contentMin: lessons.reduce((t, l) => t + (l.dur || o.DEFAULT_LESSON_MIN), 0),
        estimatedCount: lessons.filter((l) => l.dur == null && !l.block).length, blockMode: !!s.blockMode,
      });
      if (skipped) notes.push(s.blockMode ? `Em ${s.titulo}, descontamos cerca de ${pct}% da carga pelo progresso que você informou. Na área de membros, continue da aula em que parou.` : `Em ${s.titulo}, consideramos as ${skipped} primeiras aulas como já assistidas, com base no progresso que você informou. Se não for o caso, comece pela aula que parou.`);
    }
    const seqIds = seq.map((c) => c.id);
    const finished = (id) => !state.has(id) || state.get(id).queue.length === 0;
    const prereqsOk = (c) => c.prereqs.every((p) => finished(p) || rec.waived.some((w) => w.course === c.id && w.prereq === p) || !seqIds.includes(p));
    const alternate = a.sequencial === 'alternar';

    function pickCourse(sessionNo, current) {
      if (current && !finished(current)) {
        if (!alternate) return current;
      }
      const eligible = seqIds.filter((id) => !finished(id) && prereqsOk(state.get(id).course));
      if (!eligible.length) return null;
      if (!alternate) return eligible[0];
      const pair = eligible.slice(0, 2);
      return pair[(sessionNo - 1) % pair.length];
    }

    const sessions = [];
    const prefs = a.ajuda || [];
    let sessionNo = 0, current = null, lastReviewWeek = 0;
    const endBy = addDays(start, o.MAX_DAYS);
    const weekOffsets = [0, 1, 2, 3, 4, 5, 6].filter((off) => days.includes(addDays(start, off).getDay()));
    const lastOffset = weekOffsets[weekOffsets.length - 1];
    let lastStudyDate = null;
    const weekTotals = {};
    const lessonsThisWeek = {};

    for (let d = 0; ; d++) {
      const date = addDays(start, d);
      if (date > endBy) { notes.push('A sequência completa passa de 3 anos com a disponibilidade atual; mostramos a previsão até esse limite.'); break; }
      if (!days.includes(date.getDay())) continue;
      const week = Math.floor(d / 7) + 1;
      const allDone = seqIds.every(finished);
      if (allDone) break;
      sessionNo++;
      const detail = week <= o.DETAIL_WEEKS;
      const isLastOfWeek = d % 7 === lastOffset;
      const reviewWeek = week % every === 0;
      const sess = { week, date: iso(date), dow: DOW[date.getDay()], n: sessionNo, type: 'aula', items: [], minutes: 0, compMin: 0, comp: '', goal: '' };

      if (isLastOfWeek && reviewWeek && week !== lastReviewWeek && (lessonsThisWeek[week] || []).length) {
        lastReviewWeek = week;
        sess.type = 'revisao';
        const seen = lessonsThisWeek[week];
        const reviewText = seen[0].block
          ? `Revisão da semana: aulas estudadas em ${state.get(seen[0].curso).course.titulo}`
          : `Revisão da semana: ${seen.slice(0, 3).map((l) => l.titulo).join('; ')}${seen.length > 3 ? '…' : ''}`;
        sess.items.push({ review: true, courseId: seen[0].curso, course: state.get(seen[0].curso).course.titulo, text: reviewText, min: sessionMin });
        sess.minutes = sessionMin;
        sess.comp = reviewActivity(prefs, state.get(seen[0].curso).course);
        sess.goal = 'Consolidar o que foi estudado na semana antes de avançar';
      } else {
        let left = contentMin;
        let guard = 0;
        const sessionCourse = alternate ? pickCourse(sessionNo, null) : null; // alternar: um curso por sessão
        while (left > 0 && guard++ < 20) {
          const cid = alternate ? (finished(sessionCourse) ? null : sessionCourse) : pickCourse(sessionNo, current);
          if (!cid) break;
          current = cid;
          const st = state.get(cid);
          if (!st.startDate) st.startDate = iso(date);
          const q = st.queue[0];
          const take = Math.min(q.remaining, left);
          // Evita começar uma aula nova com sobra pequena: o tempo restante vira atividade complementar
          if (sess.items.length && q.part === 0 && take < q.remaining && left < 10) break;
          q.part += 1;
          q.remaining -= take;
          left -= take;
          const finishedLesson = q.remaining <= 0;
          const multipart = q.part > 1 || !finishedLesson;
          sess.items.push({
            courseId: cid, course: st.course.titulo, moduleId: q.l.modulo, module: q.l.moduloTitulo, lessonId: q.l.id, lesson: q.l.titulo,
            part: multipart ? q.part : 0, continuation: q.part > 1, lastPart: finishedLesson, min: take, estimated: q.estimated, block: q.block, blockInfo: q.block ? { stage: q.l.stage, stages: q.l.stages, stageEnd: q.l.stageEnd, first: q.l.first, last: q.l.last } : null, link: q.l.link || st.course.link || '',
          });
          if (finishedLesson) {
            st.queue.shift();
            (lessonsThisWeek[week] = lessonsThisWeek[week] || []).push(q.l);
            if (!st.queue.length) st.endDate = iso(date);
          }
        }
        if (!sess.items.length) continue;
        const used = sess.items.reduce((t, i) => t + i.min, 0);
        // Tempo não usado pela aula vai para a atividade complementar, sem passar do tamanho da sessão
        sess.compMin = compMin > 0 ? Math.min(sessionMin - used, compMin + (contentMin - used)) : 0;
        sess.minutes = used + sess.compMin;
        const course = state.get(sess.items[0].courseId).course;
        sess.comp = sess.compMin > 0 ? complementary(prefs, course, sessionNo) : 'Ao final, anote em uma frase a ideia principal (dentro do tempo da sessão)';
        sess.goal = sessionGoal(sess.items, state);
      }
      weekTotals[week] = (weekTotals[week] || 0) + sess.minutes;
      lastStudyDate = iso(date);
      if (detail) sessions.push(sess);
    }

    // Previsões
    const forecast = seqIds.map((id) => {
      const st = state.get(id);
      return { id, titulo: st.course.titulo, start: st.startDate, end: st.endDate, contentMin: st.contentMin, estimatedCount: st.estimatedCount, blockMode: st.blockMode, later: !rec.sequence.some((s) => s.id === id) };
    });

    // Verificação de prazo da primeira etapa (curso inicial)
    let deadline = null;
    if (rec.start) {
      const f = forecast.find((x) => x.id === rec.start.id);
      const limitDays = DEADLINE_DAYS[a.prazo_etapa];
      if (limitDays && f.end) {
        const limit = addDays(start, limitDays);
        const end = parseDate(f.end);
        if (end > limit) {
          const weeks = limitDays / 7;
          const contentShare = contentMin / sessionMin * (1 - 1 / Math.max(1, every * perWeek));
          const needH = Math.ceil((f.contentMin / weeks / Math.max(0.3, contentShare)) / 60 * 2) / 2;
          deadline = { ok: false, wanted: iso(limit), forecast: f.end, needHours: needH, haveHours: weeklyMin / 60 };
        } else deadline = { ok: true, wanted: iso(limit), forecast: f.end };
      }
    }

    // Marcos: conclusão de módulos dentro do período detalhado
    const milestones = [];
    const seenMods = new Set();
    for (const s of sessions) for (const it of s.items) {
      if (it.review || !it.lastPart) continue;
      const st = state.get(it.courseId);
      if (it.block) {
        const b = it.blockInfo;
        if (b.stageEnd) milestones.push({ week: s.week, date: s.date, text: b.last ? `Concluir ${st.course.titulo}` : `Concluir a etapa ${b.stage} de ${b.stages} de ${st.course.titulo}` });
        continue;
      }
      const mod = st.course.modulos.find((m) => m.id === it.moduleId);
      if (mod && mod.aulas[mod.aulas.length - 1].id === it.lessonId && !seenMods.has(mod.id)) {
        seenMods.add(mod.id);
        milestones.push({ week: s.week, date: s.date, text: `Concluir o módulo “${mod.titulo}” de ${st.course.titulo}` });
      }
    }

    // Verificação: nenhuma semana passa da disponibilidade informada
    const over = Object.entries(weekTotals).filter(([, m]) => m > weeklyMin);
    if (over.length) throw new Error('Cronograma excede a disponibilidade semanal: ' + JSON.stringify(over));

    return {
      start: iso(start), days, sessionMin, contentMin, compMin, perWeek, weeklyMin, weeklyUsed, budget, flex, reviewEvery: every,
      sessions, weekTotals, forecast, deadline, milestones, notes, lastStudyDate,
      estimatedLessons: forecast.reduce((t, f) => t + f.estimatedCount, 0), defaultLessonMin: o.DEFAULT_LESSON_MIN,
    };
  }

  function complementary(prefs, course, n) {
    const mat = course.materiais.join(' ').toLowerCase();
    const opts = [];
    if (prefs.includes('exercicios') && /exerc/.test(mat)) opts.push('Resolver os exercícios comentados do curso ligados a esta aula');
    if (prefs.includes('resumos') && /(resumo|pdf|checklist)/.test(mat)) opts.push(`Revisar o material de apoio do curso (${course.materiais.join(', ')})`);
    if (prefs.includes('exemplos') && /caso/.test(mat)) opts.push('Ler o estudo de caso do curso relacionado ao tema da aula');
    if (prefs.includes('anotacoes')) opts.push('Anotar com suas palavras os 3 pontos principais da aula');
    if (prefs.includes('exemplos')) opts.push('Pensar em um exemplo da sua rotina que ilustre o que viu');
    if (prefs.includes('aplicar')) opts.push('Escrever uma situação em que você vai aplicar o que aprendeu');
    if (prefs.includes('resumos')) opts.push('Fazer um resumo curto da aula para revisar depois');
    if (!opts.length) opts.push('Escrever um resumo de 3 linhas da aula');
    return opts[n % opts.length];
  }

  function reviewActivity(prefs, course) {
    const mat = course.materiais.join(' ').toLowerCase();
    if (prefs.includes('exercicios') && /exerc/.test(mat)) return 'Refazer os exercícios em que teve dúvida';
    if (/(resumo|pdf|checklist)/.test(mat)) return `Usar o material de apoio do curso (${course.materiais.join(', ')}) como guia da revisão`;
    return 'Reler suas anotações e listar dúvidas para retomar';
  }

  function sessionGoal(items, state) {
    const first = items[0];
    const st = state.get(first.courseId);
    const c = st.course;
    if (first.block) {
      const b = first.blockInfo;
      if (b.first) return `Iniciar o curso ${c.titulo}`;
      const end = items.find((it) => it.block && it.blockInfo.stageEnd);
      if (end) return end.blockInfo.last ? `Concluir ${c.titulo}` : `Concluir a etapa ${end.blockInfo.stage} de ${end.blockInfo.stages}`;
      return `Avançar em ${c.titulo}`;
    }
    if (c.lessons[0] && c.lessons[0].id === first.lessonId && first.part <= 1 && !first.continuation) return `Iniciar o curso ${c.titulo}`;
    const endMod = items.find((it) => it.lastPart && (() => { const m = c.modulos.find((mm) => mm.id === it.moduleId); return m && m.aulas[m.aulas.length - 1].id === it.lessonId; })());
    if (endMod) return `Concluir o módulo “${endMod.module}”`;
    if (first.continuation && !first.lastPart) return `Continuar a aula “${first.lesson}”`;
    return `Avançar no módulo “${first.module}”`;
  }

  function fmtMin(m) {
    m = Math.round(m);
    if (m < 60) return `${m} min`;
    const h = Math.floor(m / 60), r = m % 60;
    return r ? `${h}h${String(r).padStart(2, '0')}` : `${h}h`;
  }

  const api = { DEFAULTS, LEVELS, LEVEL_LABEL, DOW, buildCatalog, recommend, buildSchedule, reasonPhrases, roleOf, joinPt, fmtMin, parseDate, iso, addDays };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.Engine = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* Interface do diagnóstico — Combo Vitalício. Depende de Engine (engine.js). */
(function () {
  'use strict';

  const CONFIG = {
    // URL do App da Web do Google Apps Script (termina em /exec). Vazio = modo demonstração (nada é enviado).
    ENDPOINT: '',
    FORM_VERSION: '1.0.0',
    REQUEST_TIMEOUT_MS: 25000,
    STORAGE_KEY: 'cv-diagnostico-v1',
    PRIVACY_CONTACT: '[PROVISÓRIO] canal de contato da equipe a definir',
    // Área de membros do Combo Vitalício (usada enquanto os cursos não têm link próprio no catálogo)
    MEMBER_AREA_URL: 'https://hotmart.com/pt-BR/club/combo-vitalicio/products/4636748',
  };
  const E = window.Engine;

  /* ---------- utilidades ---------- */
  function h(tag, attrs) {
    const el = document.createElement(tag);
    if (attrs) for (const k of Object.keys(attrs)) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else if (k === 'selected') el.selected = !!v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (let i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, kid) {
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach((k) => append(el, k)); return; }
    el.append(kid instanceof Node ? kid : String(kid));
  }
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY) || 'null'); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(v)); } catch (e) { /* armazenamento indisponível */ } },
    clear() { try { localStorage.removeItem(CONFIG.STORAGE_KEY); } catch (e) { /* ignore */ } },
  };
  const uuid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'd-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10));
  const todayIso = () => E.iso(new Date());
  const fmtDate = (s) => { const d = E.parseDate(s); return d ? d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }) : ''; };
  const fmtDateShort = (s) => { const d = E.parseDate(s); return d ? d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) : ''; };
  const fmtHours = (hrs) => E.fmtMin(hrs * 60);

  /* ---------- opções ---------- */
  const O = {
    momento: [['comecando', 'Estou começando meus estudos na área.'], ['organizar', 'Já estudo o assunto, mas preciso organizar minha base.'], ['aprofundar', 'Já atuo e quero aprofundar meus conhecimentos.'], ['retomando', 'Estou retomando os estudos após um período afastado.'], ['outro', 'Outro.']],

          h('input', { type: 'checkbox', name: f.id, id: `f-${f.id}-${v}`, value: v, checked: cur.has(v), onchange: (e) => { const s = new Set(S.answers[f.id] || []); e.target.checked ? s.add(v) : s.delete(v); setAnswer(f.id, f.opts.map((o) => o[0]).filter((x) => s.has(x))); } }), h('span', null, t))));
        return fieldWrap(f, box, { group: true });
      }
      case 'weekdays': {
        const box = h('div', { class: 'days' });
        const cur = new Set(a[f.id] || []);
        O.dias.forEach(([v, t]) => box.append(h('label', { class: 'opt-row' },
          h('input', { type: 'checkbox', name: f.id, id: `f-${f.id}-${v}`, value: v, checked: cur.has(v), onchange: (e) => { const s = new Set(S.answers[f.id] || []); e.target.checked ? s.add(v) : s.delete(v); setAnswer(f.id, O.dias.map((o) => o[0]).filter((x) => s.has(x))); } }), h('span', null, t))));
        return fieldWrap(f, box, { group: true });
      }
      case 'courseSelect': {
        const sel = h('select', { id: `f-${f.id}`, 'aria-describedby': describedBy, onchange: (e) => setAnswer(f.id, e.target.value) }, h('option', { value: '' }, 'Nenhum em especial'));
        catalog.courses.forEach((c) => sel.append(h('option', { value: c.id, selected: a[f.id] === c.id }, c.titulo)));
        return fieldWrap(f, sel);
      }
      case 'courseProgress': return fieldWrap(f, renderCourseProgress(f), { group: true });
      case 'themes': return fieldWrap(f, renderThemes(f), { group: true });
      case 'themeLevels': return fieldWrap(f, renderThemeLevels(f), { group: true });
    }
    return h('div');
  }

  function renderCourseProgress(f) {
    const box = h('div', { class: 'options' });
    const val = () => Object.assign({}, S.answers.cursos_iniciados || {});
    catalog.courses.forEach((c) => {
      const cur = (S.answers.cursos_iniciados || {})[c.id];
      const detail = h('div', { class: 'inline', hidden: !cur, style: 'padding-left:28px' });
      const status = h('select', { id: `f-prog-${c.id}-status`, 'aria-label': `Situação em ${c.titulo}`, onchange: (e) => { const v = val(); v[c.id] = Object.assign({}, v[c.id], { status: e.target.value }); pctSel.hidden = e.target.value !== 'andamento'; setAnswer('cursos_iniciados', v); } },
        h('option', { value: 'andamento', selected: !cur || cur.status === 'andamento' }, 'Em andamento'),
        h('option', { value: 'concluido', selected: cur && cur.status === 'concluido' }, 'Concluído'));
      const pctSel = h('select', { id: `f-prog-${c.id}-pct`, 'aria-label': `Quanto já avançou em ${c.titulo}`, hidden: cur && cur.status === 'concluido', onchange: (e) => { const v = val(); v[c.id] = Object.assign({}, v[c.id], { pct: Number(e.target.value) }); setAnswer('cursos_iniciados', v); } },
        O.pct.map(([v, t]) => h('option', { value: v, selected: cur && String(cur.pct) === v }, t)));
      detail.append(status, pctSel);
      const cb = h('input', { type: 'checkbox', id: `f-prog-${c.id}`, checked: !!cur, onchange: (e) => {
        const v = val();
        if (e.target.checked) v[c.id] = { status: S.answers.iniciou === 'concluiu' ? 'concluido' : 'andamento', pct: 10 }; else delete v[c.id];
        detail.hidden = !e.target.checked;
        if (v[c.id]) { status.value = v[c.id].status; pctSel.value = '10'; pctSel.hidden = v[c.id].status !== 'andamento'; }
        setAnswer('cursos_iniciados', v);
      } });
      box.append(h('div', { class: 'subcard', style: 'padding:0;border:0;background:transparent' },
        h('label', { class: 'opt-row' }, cb, h('span', null, c.titulo)), detail));
    });
    return box;
  }

  function renderThemes() {
    const wrap = h('div', { class: 'stack' });
    const list = h('ol', { class: 'prio-list', 'aria-label': 'Sua ordem de prioridade' });
    const boxes = h('div', { class: 'options cols' });
    const draw = () => {
      const sel = (S.answers.temas || []).filter((t) => catalog.themes.includes(t));
      list.replaceChildren();
      sel.forEach((t, i) => list.append(h('li', null,
        h('span', { class: 'rank' }, `${i + 1}º`), h('span', { class: 'name' }, t),
        i > 0 ? h('button', { type: 'button', class: 'icon-btn', 'aria-label': `Subir ${t} na prioridade`, onclick: () => move(i, -1) }, '↑') : null,
        i < sel.length - 1 ? h('button', { type: 'button', class: 'icon-btn', 'aria-label': `Descer ${t} na prioridade`, onclick: () => move(i, 1) }, '↓') : null)));
      list.hidden = !sel.length;
      boxes.querySelectorAll('input').forEach((inp) => { inp.checked = sel.includes(inp.value); inp.disabled = !inp.checked && sel.length >= 3; });
    };
    const move = (i, d) => { const s = (S.answers.temas || []).slice(); const [x] = s.splice(i, 1); s.splice(i + d, 0, x); setAnswer('temas', s); draw(); };
    catalog.themes.forEach((t, i) => boxes.append(h('label', { class: 'opt-row' },
      h('input', { type: 'checkbox', id: `f-temas-${i}`, value: t, onchange: (e) => {
        let s = (S.answers.temas || []).filter((x) => catalog.themes.includes(x));
        if (e.target.checked && s.length < 3) s.push(t); else s = s.filter((x) => x !== t);
        setAnswer('temas', s); draw();
      } }), h('span', null, t))));
    wrap.append(boxes, list);
    setTimeout(draw, 0);
    return wrap;
  }

  function renderThemeLevels() {
    const themes = (S.answers.temas || []).filter((t) => catalog.themes.includes(t));
    const box = h('div', { class: 'stack' });
    if (!themes.length) { box.append(h('p', { class: 'muted' }, 'Escolha seus temas na etapa 2 para responder esta pergunta.')); return box; }
    themes.forEach((t, ti) => {
      const g = h('div', { class: 'seg', role: 'radiogroup', 'aria-label': t });
      O.nivel.forEach(([v, lab]) => g.append(h('label', { class: 'opt-row' },
        h('input', { type: 'radio', name: `nivel-${ti}`, id: `f-nivel_tema-${ti}-${v}`, value: v, checked: (S.answers.nivel_tema || {})[t] === v, onchange: () => { const m = Object.assign({}, S.answers.nivel_tema || {}); m[t] = v; setAnswer('nivel_tema', m); } }),
        h('span', null, lab))));
      box.append(h('div', { class: 'subcard' }, h('strong', null, t), g));
    });
    return box;
  }

  function updateVisibility() {
    app.querySelectorAll('[data-field]').forEach((el) => {
      const f = ALL_FIELDS.find((x) => x.id === el.dataset.field);
      if (f) el.hidden = !isVisible(f, S.answers);
    });
  }

  /* ----- validação ----- */
  function validateField(f, a) {
    if (!isVisible(f, a)) return null;
    const v = a[f.id];
    const empty = v == null || v === '' || (Array.isArray(v) && !v.length);
    switch (f.type) {
      case 'email':
        if (empty) return 'Informe o e-mail usado na compra ou no acesso ao combo.';
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim())) return 'Confira o e-mail: ele deve ter o formato nome@exemplo.com.';
        return null;
      case 'number': {
        if (empty) return 'Informe quantas horas por semana você consegue estudar.';
        const n = parseFloat(String(v).replace(',', '.'));
        if (!(n >= f.min && n <= f.maxN)) return `Informe um valor entre ${String(f.min).replace('.', ',')} e ${f.maxN} horas.`;
        return null;
      }
      case 'date':
        if (f.req && !a[f.id] && f.id === 'inicio') { a.inicio = todayIso(); return null; }
        if (a[f.id] && !E.parseDate(a[f.id])) return 'Informe uma data válida.';
        if (f.minToday && a[f.id] && a[f.id] < todayIso()) return 'Escolha hoje ou uma data futura.';
        return null;
      case 'themes':
        if (empty) return 'Escolha pelo menos um tema.';
        return null;
      case 'themeLevels': {
        const ts = (a.temas || []).filter((t) => catalog.themes.includes(t));
        const missing = ts.filter((t) => !(a.nivel_tema || {})[t]);
        return missing.length ? `Indique seu nível em: ${missing.join(', ')}.` : null;
      }
      case 'courseProgress':
        return f.req && (!v || !Object.keys(v).length) ? 'Marque pelo menos um curso ou volte e escolha “Ainda não comecei”.' : null;
      case 'weekdays':
        return empty ? 'Escolha pelo menos um dia da semana.' : null;
    }
    if (f.req && (empty || (typeof v === 'string' && !v.trim()))) return f.msg || `Responda: ${f.label.replace(/\?$/, '')}.`;
    return null;
  }

  function clearError(id) {
    const wrap = app.querySelector(`[data-field="${id}"]`);
    if (!wrap || !wrap.classList.contains('invalid')) return;
    wrap.classList.remove('invalid');
    const e = wrap.querySelector('.err-msg'); if (e) e.hidden = true;
  }

  function validateStep() {
    const st = STEPS[S.step];
    const errs = [];
    st.fields.forEach((f) => {
      const msg = validateField(f, S.answers);
      const wrap = app.querySelector(`[data-field="${f.id}"]`);
      if (!wrap) return;
      const e = wrap.querySelector('.err-msg');
      wrap.classList.toggle('invalid', !!msg);
      if (e) { e.textContent = msg || ''; e.hidden = !msg; }
      if (msg) errs.push({ f, msg });
    });
    const box = app.querySelector('#err-box');
    box.replaceChildren();
    if (errs.length) {
      const ul = h('ul');
      errs.forEach(({ f, msg }) => ul.append(h('li', null, h('a', { href: '#', onclick: (ev) => { ev.preventDefault(); focusField(f.id); } }, msg))));
      const summary = h('div', { class: 'err-summary', tabindex: '-1' }, h('strong', null, errs.length === 1 ? 'Falta 1 resposta nesta etapa:' : `Faltam ${errs.length} respostas nesta etapa:`), ul);
      box.append(summary);
      summary.focus();
      return false;
    }
    return true;
  }
  function focusField(id) {
    const wrap = app.querySelector(`[data-field="${id}"]`);
    const el = wrap && wrap.querySelector('input:not([disabled]), select, textarea');
    if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
  }

  function next() {
    if (!validateStep()) return;
    if (S.fromReview) { S.fromReview = false; show('review'); return; }
    if (S.step < STEPS.length - 1) { S.step++; show('step'); } else show('review');
  }
  function back() { if (S.step > 0) { S.step--; show('step'); } }

  /* ----- revisão ----- */
  function displayValue(f, a) {
    const v = a[f.id];
    if (v == null || v === '' || (Array.isArray(v) && !v.length)) return null;
    switch (f.type) {
      case 'radio': return label(f.opts, v);
      case 'checkbox': return v.map((x) => label(f.opts, x)).join('\n');
      case 'weekdays': return v.map((x) => label(O.dias, x)).join(', ');
      case 'themes': return v.map((t, i) => `${i + 1}º ${t}`).join('\n');
      case 'themeLevels': return (a.temas || []).filter((t) => v[t]).map((t) => `${t}: ${label(O.nivel, v[t])}`).join('\n') || null;
      case 'courseSelect': return catalog.byId[v] ? catalog.byId[v].titulo : null;
      case 'courseProgress': return Object.entries(v).filter(([id]) => catalog.byId[id]).map(([id, p]) => `${catalog.byId[id].titulo}: ${p.status === 'concluido' ? 'concluído' : 'em andamento, ' + label(O.pct, String(p.pct)).toLowerCase()}`).join('\n') || null;
      case 'date': return fmtDate(v);
      case 'number': return `${String(v).replace('.', ',')} ${f.suffix || ''}`;
      default: return String(v);
    }
  }

  function renderReview() {
    const a = S.answers;
    const sections = STEPS.map((st, i) => {
      const dl = h('dl');
      st.fields.filter((f) => isVisible(f, a)).forEach((f) => {
        const dv = displayValue(f, a);
        if (dv == null) return;
        dl.append(h('dt', null, f.label), h('dd', null, dv));
      });
      if (!dl.childNodes.length) dl.append(h('dd', { class: 'muted' }, 'Sem respostas nesta etapa.'));
      return h('section', { class: 'panel review-step' },
        h('header', null, h('h3', null, st.title), h('button', { class: 'btn ghost no-print', type: 'button', 'aria-label': `Editar ${st.title}`, onclick: () => { S.step = i; S.fromReview = true; show('step'); } }, 'Editar')),
        dl);
    });
    const consentErr = h('p', { class: 'err-msg', id: 'err-consent', hidden: true }, 'Confirme que leu como usamos suas respostas para gerar o plano.');
    const consent = h('label', { class: 'opt-row' },
      h('input', { type: 'checkbox', id: 'f-consent', checked: S.consent, 'aria-describedby': 'err-consent', onchange: (e) => { S.consent = e.target.checked; consentErr.hidden = true; persistSoon(); } }),
      h('span', null, 'Li como minhas respostas serão usadas e concordo com o registro delas para gerar meu plano de estudos.'));
    const honeypot = h('div', { class: 'sr-only', 'aria-hidden': 'true' }, h('label', { for: 'f-website' }, 'Não preencha este campo'), h('input', { id: 'f-website', type: 'text', tabindex: '-1', autocomplete: 'off' }));
    return h('section', { class: 'stack-lg', 'aria-labelledby': 'rev-title' },
      progressBar(STEPS.length),
      h('div', { class: 'stack' }, h('h2', { id: 'rev-title', 'data-focus': '' }, 'Confira suas respostas'), h('p', { class: 'muted' }, 'Se algo mudou, use “Editar” na etapa. Quando estiver tudo certo, gere seu plano.')),
      sections, privacyNotice(),
      h('div', { class: 'field' }, consent, consentErr), honeypot,
      h('div', { class: 'actions no-print' },
        h('button', { class: 'btn secondary', type: 'button', onclick: () => { S.step = STEPS.length - 1; show('step'); } }, 'Voltar'),
        h('button', { class: 'btn', type: 'button', onclick: () => { if (!S.consent) { consentErr.hidden = false; document.getElementById('f-consent').focus(); return; } submit(); } }, 'Gerar meu plano de estudos')));
  }

  /* ----- envio ----- */
  function computePlan() {
    const a = S.answers;
    const rec = E.recommend(a, catalog);
    const sched = rec.completedAll ? null : E.buildSchedule(a, rec, catalog);
    return { rec, sched };
  }

  function flatAnswers(a) {
    const out = {};
    ALL_FIELDS.forEach((f) => {
      if (!isVisible(f, a)) { out[f.id] = ''; return; }
      const v = a[f.id];
      if (f.type === 'courseSelect') out[f.id] = v && catalog.byId[v] ? `${v} - ${catalog.byId[v].titulo}` : '';
      else if (f.type === 'date') out[f.id] = v || '';
      else if (f.type === 'number') out[f.id] = v ? String(v).replace(',', '.') : '';
      else out[f.id] = displayValue(f, a) == null ? '' : String(displayValue(f, a)).replace(/\n/g, '; ');
    });
    out.consentimento = S.consent ? 'sim' : 'não';
    return out;
  }

  function buildPayload(plan) {
    const a = S.answers;
    const { rec, sched } = plan;
    const profile = profileSummary(a, rec, sched);
    const planRow = rec.start ? {
      resumo_perfil: profile,
      curso_inicial_id: rec.start.id,
      curso_inicial: rec.start.course.titulo,
      justificativa: justificationText(rec),
      sequencia: rec.sequence.map((s, i) => `${i + 1}. ${s.course.titulo} [${s.id}]`).join('; '),
      depois: rec.later.map((c) => `${c.titulo} [${c.id}]`).join('; '),
      carga_semanal_h: String(Number(a.horas_semana)),
      sessoes_semana: String(sched.perWeek),
      minutos_sessao: String(sched.sessionMin),
      inicio: sched.start,
      previsao_etapa: (sched.forecast.find((f) => f.id === rec.start.id) || {}).end || '',
      previsao_sequencia: sched.forecast.filter((f) => !f.later).map((f) => f.end).filter(Boolean).sort().pop() || '',
      prazo_desejado: label(O.prazo_etapa, a.prazo_etapa),
      prazo_viavel: sched.deadline ? (sched.deadline.ok ? 'sim' : `não (seriam necessárias ~${String(sched.deadline.needHours).replace('.', ',')} h/semana)`) : 'sem prazo definido',
      aulas_estimadas: String(sched.estimatedLessons),
    } : { resumo_perfil: profile, justificativa: 'Todos os cursos relacionados aos temas escolhidos já foram concluídos.' };
    const schedule = sched ? sched.sessions.flatMap((s) => s.items.map((it) => ({
      semana: String(s.week), data: s.date, dia_semana: s.dow, sessao: String(s.n), tipo: s.type,
      curso_id: it.courseId, curso: it.course, modulo: it.review ? '' : it.module, aula_id: it.review ? '' : it.lessonId,
      aula: it.review ? it.text : it.lesson + (it.part ? ` (parte ${it.part})` : ''),
      minutos: String(it.min), duracao_estimada: it.estimated ? 'sim' : 'não',
      atividade_complementar: s.comp + (s.compMin ? ` (${s.compMin} min)` : ''), objetivo_sessao: s.goal, link: it.link || '',
    }))) : [];
    const sug = {};
    ['temas_futuros', 'aprofundar', 'formatos', 'falta', 'melhoria'].forEach((k) => { sug[k] = flatAnswers(a)[k]; });
    return {
      action: 'submit', id: S.pendingId, formVersion: CONFIG.FORM_VERSION, catalogVersion: catalog.version,
      clientSubmittedAt: new Date().toISOString(), website: (document.getElementById('f-website') || {}).value || '',
      answers: flatAnswers(a), plan: planRow, schedule, suggestions: sug,
      courseIds: rec.sequence.map((s) => s.id).concat(rec.later.map((c) => c.id)),
    };
  }

  async function submit() {
    if (!S.pendingId) S.pendingId = uuid(); // mesmo ID em todas as tentativas: o servidor ignora duplicatas
    persist();
    let plan;
    try { plan = computePlan(); } catch (e) { console.error(e); show('error', { kind: 'plan', message: e.message }); return; }
    S.result = plan;
    if (!CONFIG.ENDPOINT) { S.saved = false; S.mode = 'demo'; show('result'); return; }
    show('sending');
    try {
      const payload = buildPayload(plan);
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), CONFIG.REQUEST_TIMEOUT_MS);
      let j;
      try {
        const r = await fetch(CONFIG.ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), signal: ctrl.signal, redirect: 'follow' });
        j = await r.json();
      } finally { clearTimeout(t); }
      if (!j || !j.ok) throw new Error((j && j.error) || 'Resposta inesperada do servidor');
      S.saved = true; S.mode = 'saved';
      show('result');
    } catch (e) {
      console.error(e);
      show('error', { kind: 'send', message: e.name === 'AbortError' ? 'O servidor demorou para responder.' : e.message });
    }
  }

  function renderSending() {
    return h('section', { class: 'stack', 'aria-busy': 'true' },
      h('h2', { 'data-focus': '' }, 'Gerando e salvando seu plano…'),
      h('p', { class: 'muted', role: 'status' }, 'Isso costuma levar alguns segundos. Não feche esta página.'));
  }

  function renderError(opts) {
    const isPlan = opts && opts.kind === 'plan';
    return h('section', { class: 'stack-lg' },
      h('div', { class: 'banner err', role: 'alert' }, h('span', null, h('strong', null, isPlan ? 'Não foi possível montar o plano. ' : 'Seu plano ainda não foi salvo. '),
        isPlan ? 'Revise suas respostas e tente novamente.' : 'Suas respostas continuam guardadas neste navegador. Verifique sua conexão e tente de novo; o reenvio não cria registro duplicado.')),
      h('h2', { 'data-focus': '' }, isPlan ? 'Algo deu errado ao gerar o plano' : 'Não conseguimos salvar agora'),
      opts && opts.message ? h('p', { class: 'muted small' }, 'Detalhe técnico: ' + opts.message) : null,
      h('div', { class: 'actions' },
        h('button', { class: 'btn secondary', type: 'button', onclick: () => show('review') }, 'Voltar à revisão'),
        !isPlan ? h('button', { class: 'btn ghost', type: 'button', onclick: () => { S.saved = false; S.mode = 'unsaved'; show('result'); } }, 'Ver o plano sem salvar') : null,
        h('button', { class: 'btn', type: 'button', onclick: submit }, 'Tentar novamente')));
  }

  /* ----- resultado ----- */
  function profileSummary(a, rec, sched) {
    const parts = [];
    parts.push(`Objetivo: ${a.objetivo === 'outro' && a.objetivo_outro ? 'outro' : label(O.objetivo, a.objetivo).replace(/\.$/, '').toLowerCase()}.`);
    parts.push(`Temas: ${rec.themes.map((t) => `${t} (${label(O.nivel, (a.nivel_tema || {})[t] || 'iniciante').toLowerCase()})`).join(', ')}.`);
    parts.push(`Ponto de partida: ${label(O.momento, a.momento).replace(/\.$/, '').toLowerCase()}.`);
    if (sched) parts.push(`Disponibilidade: ${fmtHours(Number(a.horas_semana))} por semana em ${sched.perWeek} sessão(ões) de até ${E.fmtMin(sched.sessionMin)}.`);
    return parts.join(' ');
  }

  function justificationNodes(rec) {
    const ph = E.reasonPhrases(rec.start, rec, catalog);
    const t = rec.start.course.titulo;
    if (!ph.length) return ['Indicamos ', h('strong', null, t), ' como primeiro passo porque ele é a base dos demais cursos ligados aos seus temas.'];
    return ['Indicamos ', h('strong', null, t), ' como primeiro passo porque ', E.joinPt(ph), '.'];
  }
  const justificationText = (rec) => justificationNodes(rec).map((n) => (typeof n === 'string' ? n : n.textContent)).join('');

  function renderResult() {
    const a = S.answers;
    const { rec, sched } = S.result;
    const name = String(a.nome || '').trim().split(/\s+/)[0] || '';
    const status = S.mode === 'saved'
      ? h('div', { class: 'banner ok no-print', role: 'status' }, h('span', null, h('strong', null, 'Plano salvo. '), 'Suas respostas e seu plano foram registrados com sucesso.'))
      : S.mode === 'unsaved'
        ? h('div', { class: 'banner err no-print', role: 'status' }, h('span', null, h('strong', null, 'Plano ainda não salvo. '), 'Você pode consultar o plano abaixo, mas ele não foi registrado. ', h('button', { class: 'btn ghost', type: 'button', onclick: submit }, 'Tentar salvar de novo')))
        : null; // modo demonstração: o aviso fixo do topo já informa que nada foi enviado

    const head = h('div', { class: 'stack' },
      h('p', { class: 'eyebrow' }, 'Seu plano de estudos'),
      h('h2', { 'data-focus': '' }, name ? `${name}, este é o seu próximo passo` : 'Este é o seu próximo passo'),
      h('p', { class: 'muted small' }, `Gerado em ${new Date().toLocaleDateString('pt-BR')} · catálogo ${catalog.version}${catalog.demo ? ' (demonstração)' : ''}`));

    if (rec.completedAll) {
      return h('section', { class: 'stack-lg' }, status, head,
        h('div', { class: 'panel stack' }, h('p', null, 'Você já concluiu todos os cursos do catálogo ligados aos temas que escolheu. Refaça o diagnóstico escolhendo outros temas, ou fale com a equipe para indicar os próximos passos.')),
        restartActions());
    }

    // Seu momento atual
    const momento = h('section', { class: 'result-section', 'aria-labelledby': 'r-momento' },
      h('h3', { id: 'r-momento' }, 'Seu momento atual'),
      h('p', null, profileSummary(a, rec, sched)),
      h('div', { class: 'facts' },
        fact(fmtHours(sched.weeklyMin / 60), 'por semana informadas'),
        fact(`${sched.perWeek}× ${E.fmtMin(sched.sessionMin)}`, 'sessões por semana'),
        fact(fmtDate(sched.start), 'início do plano'),
        fact(label(O.ritmo, a.ritmo).split(',')[0].replace(/\.$/, ''), 'ritmo escolhido')));

    // Por onde começar
    const sc = rec.start.course;
    const startCard = h('section', { class: 'start-card', 'aria-labelledby': 'r-start' },
      h('p', { class: 'eyebrow' }, 'Por onde começar'),
      h('h3', { id: 'r-start' }, sc.titulo),
      sc.descricao ? h('p', { class: 'muted' }, sc.descricao) : null,
      h('p', null, justificationNodes(rec)),
      rec.start.pct ? h('p', { class: 'small' }, 'Você já começou este curso. Retome pela aula indicada no cronograma ou pela aula em que parou.') : null,
      sc.link ? h('div', null, h('a', { class: 'btn', href: sc.link, target: '_blank', rel: 'noopener' }, 'Acessar o curso'))
        : CONFIG.MEMBER_AREA_URL ? h('div', { class: 'stack' }, h('div', null, h('a', { class: 'btn', href: CONFIG.MEMBER_AREA_URL, target: '_blank', rel: 'noopener' }, 'Abrir a área de membros')), h('p', { class: 'small muted' }, `Na área de membros, abra a trilha “${sc.titulo}”.`))
          : h('p', { class: 'small muted' }, 'O link oficial deste curso ainda não foi cadastrado no catálogo.'));

    // Curso desejado fora do início
    let desiredNote = null;
    if (rec.desired && rec.desired.id !== rec.start.id) {
      const pos = rec.sequence.findIndex((s) => s.id === rec.desired.id);
      const missingPre = rec.desired.prereqs.filter((p) => rec.sequence.some((s) => s.id === p) || rec.later.some((c) => c.id === p));
      desiredNote = h('p', { class: 'small' }, `Sobre ${rec.desired.titulo}, o curso que você quer muito começar: `,
        pos >= 0 ? `ele está na posição ${pos + 1} da sua sequência` : 'ele entra depois da sequência principal',
        missingPre.length ? ` porque depende de ${E.joinPt(missingPre.map((p) => catalog.byId[p].titulo))}.` : ' para respeitar suas prioridades e os pré-requisitos.');
    }

    // Sequência
    const seqList = h('ol', { class: 'seq' });
    rec.sequence.forEach((s, i) => {
      const f = sched.forecast.find((x) => x.id === s.id);
      const prog = S.answers.iniciou !== 'nao' ? (S.answers.cursos_iniciados || {}) : {};
      const pre = s.course.prereqs.map((p) => catalog.byId[p].titulo + ((prog[p] || {}).status === 'concluido' ? ' (já concluído)' : ''));
      seqList.append(h('li', null, h('span', { class: 'n' }, String(i + 1)), h('div', null,
        h('strong', null, s.course.titulo),
        h('div', { class: 'meta' }, E.roleOf(s, i, catalog), ' · ', f.blockMode ? `carga estimada de ${E.fmtMin(f.contentMin)} (provisória)` : `${E.fmtMin(f.contentMin)} de aulas${f.estimatedCount ? ' (inclui estimativas)' : ''}`),
        pre.length ? h('div', { class: 'meta' }, `Pré-requisito: ${E.joinPt(pre)}`) : null,
        f.end ? h('div', { class: 'meta' }, `Previsão: ${fmtDateShort(f.start)} a ${fmtDate(f.end)}`) : null)));
    });
    const seqSection = h('section', { class: 'result-section', 'aria-labelledby': 'r-seq' },
      h('h3', { id: 'r-seq' }, 'Sua sequência de estudos'),
      h('p', { class: 'muted small' }, 'A ordem respeita os pré-requisitos de cada curso e depois as suas prioridades.'),
      h('div', { class: 'panel' }, seqList), desiredNote,
      rec.later.length ? h('p', { class: 'small muted' }, `Depois dessa sequência: ${rec.later.map((c) => c.titulo).join(', ')}.`) : null,
      rec.waived.length ? h('p', { class: 'small muted' }, rec.waived.map((w) => `Como você já avançou em ${catalog.byId[w.course].titulo}, não pedimos que volte para ${catalog.byId[w.prereq].titulo} antes de continuar. Se sentir falta da base, faça esse curso em paralelo.`).join(' ')) : null);

    // Cronograma
    const weeks = {};
    sched.sessions.forEach((s) => (weeks[s.week] = weeks[s.week] || []).push(s));
    const weekKeys = Object.keys(weeks).map(Number).sort((x, y) => x - y);
    const cron = h('section', { class: 'result-section', 'aria-labelledby': 'r-cron' },
      h('h3', { id: 'r-cron' }, weekKeys.length >= 4 ? 'Seu cronograma das próximas quatro semanas' : 'Seu cronograma'),
      h('p', { class: 'muted small' }, `Cada semana usa no máximo o tempo que você informou (${fmtHours(sched.weeklyMin / 60)}). Aulas longas aparecem divididas em partes.`),
      weekKeys.map((w) => weekTable(w, weeks[w], sched)));
    const notes = [];
    if (sched.forecast.some((f) => f.blockMode)) notes.push('As aulas e durações dos cursos ainda estão sendo cadastradas. Por isso o cronograma usa blocos de estudo de 30 minutos sobre uma carga horária estimada e provisória. Em cada bloco, siga a ordem das aulas do curso na área de membros, de onde parou. As datas de conclusão são estimativas.');
    if (sched.estimatedLessons) notes.push(`${sched.estimatedLessons} aula(s) ainda não têm duração cadastrada no catálogo. Para elas usamos uma estimativa de ${sched.defaultLessonMin} minutos, marcada como “estimado”.`);
    notes.push(...sched.notes);
    if (sched.deadline && !sched.deadline.ok) notes.push(`Você gostaria de concluir a primeira etapa até ${fmtDate(sched.deadline.wanted)}. Com ${fmtHours(sched.deadline.haveHours)} por semana, a previsão realista é ${fmtDate(sched.deadline.forecast)}. Para chegar antes, seriam necessárias cerca de ${String(sched.deadline.needHours).replace('.', ',')} h por semana. Mantivemos o plano dentro do tempo que você tem.`);
    if (sched.deadline && sched.deadline.ok) notes.push(`A previsão de conclusão de ${sc.titulo} (${fmtDate(sched.deadline.forecast)}) cabe no prazo que você deseja.`);
    if (a.prazo_compromisso === 'sim' && a.prazo_data) notes.push(`Você mencionou um compromisso em ${fmtDate(a.prazo_data)}. Use o plano como apoio na preparação; ele não garante um resultado.`);
    cron.append(h('div', { class: 'panel stack small' }, h('strong', null, 'Observações sobre o cronograma'), h('ul', { class: 'intro-list' }, notes.map((n) => h('li', null, n)))));
    const fc = h('ul', { class: 'forecast' });
    sched.forecast.filter((f) => f.end).forEach((f) => fc.append(h('li', null, h('span', null, f.titulo), h('span', null, `${fmtDateShort(f.start)} → ${fmtDate(f.end)}`))));
    cron.append(h('div', { class: 'stack' }, h('strong', null, 'Previsão das próximas etapas'), h('p', { class: 'small muted' }, 'Estimativa mantendo o mesmo ritmo. Ela muda se sua rotina mudar, e tudo bem.'), fc));

    // Evolução
    const ms = sched.milestones.slice(0, 5).map((m) => h('li', null, `${m.text} (semana ${m.week})`));
    const evo = h('section', { class: 'result-section', 'aria-labelledby': 'r-evo' },
      h('h3', { id: 'r-evo' }, 'Como acompanhar sua evolução'),
      h('ul', { class: 'checklist' },
        h('li', null, 'Cumprir as sessões da primeira semana, mesmo que mais curtas que o previsto'),
        ms,
        h('li', null, 'Na revisão semanal, listar um conceito que ficou mais claro e uma dúvida que ainda resta'),
        (a.evolucao || []).includes('aplicacao') ? h('li', null, 'Registrar uma situação em que você aplicou algo que estudou') : null));

    const change = h('section', { class: 'result-section', 'aria-labelledby': 'r-change' },
      h('h3', { id: 'r-change' }, 'Se sua rotina mudar'),
      h('ul', { class: 'intro-list' },
        h('li', null, 'Perdeu uma sessão? Siga para a próxima do ponto em que parou. Não é preciso compensar tudo de uma vez.'),
        h('li', null, 'Semana apertada? Faça só a parte de aula e deixe a atividade complementar para a revisão.'),
        h('li', null, 'Se sua disponibilidade ou seus objetivos mudarem, refaça o diagnóstico para gerar um plano novo. O histórico anterior fica guardado.')));

    return h('section', { class: 'stack-lg' }, status, head, momento, startCard, seqSection, cron, evo, change, restartActions());
  }

  function fact(v, l) { return h('div', { class: 'fact' }, h('b', null, v), h('span', null, l)); }

  function weekTable(w, sessions, sched) {
    const total = sessions.reduce((t, s) => t + s.minutes, 0);
    const tbody = h('tbody');
    sessions.forEach((s) => {
      let lastCtx = '';
      const lessons = s.items.map((it) => it.review
        ? h('div', { class: 'lesson-line' }, h('span', { class: 'course' }, it.course), it.text)
        : h('div', { class: 'lesson-line' },
          (() => { const ctx = `${it.course} · ${it.module}`; if (ctx === lastCtx) return null; lastCtx = ctx; return h('span', { class: 'course' }, ctx); })(),
          it.link ? h('a', { href: it.link, target: '_blank', rel: 'noopener' }, it.lesson) : it.lesson,
          it.part ? h('span', { class: 'tag cont' }, it.continuation ? `continuação, parte ${it.part}` : `parte ${it.part}`) : null,
          it.estimated && !it.block ? h('span', { class: 'tag' }, 'estimado') : null,
          it.block && (!it.part || it.part === 1) ? h('span', { class: 'tag' }, 'bloco de estudo') : null,
          ` · ${E.fmtMin(it.min)}`));
      tbody.append(h('tr', { class: s.type === 'revisao' ? 'rev' : '' },
        h('td', { 'data-label': 'Semana', class: 'num' }, String(s.week)),
        h('td', { 'data-label': 'Dia ou sessão' }, h('div', null, `${s.dow}, ${fmtDateShort(s.date)}`, h('br'), h('span', { class: 'muted small' }, `Sessão ${s.n}`))),
        h('td', { 'data-label': 'Curso e aula' }, h('div', null, lessons)),
        h('td', { 'data-label': 'Tempo previsto', class: 'num' }, E.fmtMin(s.minutes)),
        h('td', { 'data-label': 'Atividade complementar' }, h('div', null, s.comp, s.compMin ? ` (${E.fmtMin(s.compMin)})` : '')),
        h('td', { 'data-label': 'Objetivo da sessão' }, s.goal)));
    });
    return h('div', { class: 'week' },
      h('div', { class: 'week-head' }, h('strong', null, `Semana ${w}`), h('small', null, `${E.fmtMin(total)} de ${E.fmtMin(sched.weeklyMin)} disponíveis`)),
      h('div', { class: 'table-wrap' }, h('table', { class: 'plan' },
        h('thead', null, h('tr', null, ['Semana', 'Dia ou sessão', 'Curso e aula', 'Tempo previsto', 'Atividade complementar', 'Objetivo da sessão'].map((c) => h('th', { scope: 'col' }, c)))),
        tbody)));
  }

  function restartActions() {
    const framed = window.self !== window.top;
    return h('div', { class: 'actions no-print' },
      framed ? h('p', { class: 'small muted grow' }, 'Para imprimir ou salvar em PDF, abra a página publicada fora desta prévia.')
        : h('button', { class: 'btn secondary', type: 'button', onclick: () => window.print() }, 'Imprimir ou salvar em PDF'),
      h('button', { class: 'btn', type: 'button', onclick: () => { store.clear(); S = { view: 'intro', step: 0, answers: {}, pendingId: null, fromReview: false, result: null, saved: false, consent: false }; show('step'); } }, 'Refazer o diagnóstico'));
  }

  /* ---------- início ---------- */
  async function boot() {
    app.replaceChildren(h('p', { class: 'muted', role: 'status' }, 'Carregando o catálogo de cursos…'));
    try {
      await loadCatalog();
      renderBanner();
      show('intro', { noFocus: true });
    } catch (e) {
      console.error(e);
      app.replaceChildren(h('section', { class: 'stack' },
        h('div', { class: 'banner err', role: 'alert' }, h('span', null, h('strong', null, 'Não foi possível carregar o catálogo de cursos. '), 'Verifique sua conexão e tente novamente.')),
        h('div', null, h('button', { class: 'btn', type: 'button', onclick: boot }, 'Tentar novamente'))));
    }
  }
  // Exposto para testes automatizados
  window.__cv = { get state() { return S; }, get catalog() { return catalog; }, computePlan, buildPayload };
  boot();
})();

</script>

</body>
</html>
